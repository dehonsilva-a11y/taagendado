<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#C10232">
    <title>Acesso bloqueado · Lello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth">
    <div class="auth-shell">
        <section class="auth-brand">
            <img src="{{ url_for('static', filename='img/lello-logo-branco.png') }}" alt="Lello">
            <p class="tag mb-0">Acesso desativado.
                <small>Sua conta existe, mas está bloqueada no momento.</small>
            </p>
        </section>

        <section class="auth-panel">
            <div class="auth-card">
                <div class="lock-badge"><i class="bi bi-lock-fill"></i></div>
                <h1>Seu acesso está bloqueado</h1>
                <p class="lead-sm">Se você acredita que foi um engano, fale com o gerente da sua filial para liberar o acesso.</p>
                <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg w-100">
                    <i class="bi bi-arrow-left me-2"></i> Voltar ao login
                </a>
            </div>
        </section>
    </div>
</body>
</html>
