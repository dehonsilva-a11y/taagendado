<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { 
            background: #f0f2f5; 
            font-family: 'Nunito', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border-top: 5px solid #0d6efd; 
        }
        .btn-google { 
            background-color: #fff; 
            border: 1px solid #dae0e6; 
            color: #3c4043; 
            font-weight: 600; 
            transition: background-color 0.2s; 
        }
        .btn-google:hover:not(:disabled) { 
            background-color: #f8f9fa; 
        }
        .google-icon { 
            width: 20px; 
            margin-right: 10px; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="bi bi-buildings-fill text-primary mb-3" style="font-size: 3rem;"></i>
        <h3 class="fw-bold mb-2">Acesso ao Sistema</h3>
        <p class="text-muted small mb-4">Faça login com seu e-mail corporativo.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} small fw-bold">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Botão de Login do Google -->
        <button id="btnGoogle" onclick="fazerLoginGoogle()" class="btn btn-google w-100 py-2 d-flex justify-content-center align-items-center">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon" alt="Google">
            Entrar com o Google
        </button>

        <div id="loading" class="mt-3 d-none text-primary small">
            <div class="spinner-border spinner-border-sm me-1" role="status"></div> Autenticando...
        </div>
    </div>

    <!-- Bibliotecas do Firebase (Compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

    <!-- 1. Passamos os dados do Flask para uma tag de dados limpa e invisível -->
    <script id="firebase-config-data" type="application/json">
        {{ firebase_config | tojson | safe }}
    </script>

    <script>
        // 2. O Javascript lê a tag acima e converte para objeto (sem alertar erros no VS Code)
        const configData = document.getElementById('firebase-config-data').textContent;
        const firebaseConfig = JSON.parse(configData);

        firebase.initializeApp(firebaseConfig);
        const provider = new firebase.auth.GoogleAuthProvider();

        function alternarCarregamento(carregando) {
            const btn = document.getElementById('btnGoogle');
            const loading = document.getElementById('loading');
            btn.disabled = carregando;
            if (carregando) {
                loading.classList.remove('d-none');
            } else {
                loading.classList.add('d-none');
            }
        }

        async function fazerLoginGoogle() {
            // ... (mantenha o restante da função fazerLoginGoogle exatamente igual)
            alternarCarregamento(true);

            try {
                const result = await firebase.auth().signInWithPopup(provider);
                const token = await result.user.getIdToken();

                const resposta = await fetch('/auth_google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: token })
                });

                const dados = await resposta.json().catch(() => null);

                if (resposta.ok && dados && dados.status === 'success') {
                    window.location.href = "/";
                } else if (dados && dados.status === 'bloqueado') {
                    await firebase.auth().signOut();
                    window.location.href = "/bloqueado"; 
                } else {
                    const mensagem = dados?.message || 'Falha na validação do acesso.';
                    alert(mensagem);
                    await firebase.auth().signOut();
                    alternarCarregamento(false);
                }
            } catch (error) {
                console.error("Erro no login:", error);
                if (error.code === 'auth/unauthorized-domain') {
                    alert('Este domínio ainda não foi autorizado no Firebase Console. Adicione o link da Vercel em Authentication > Settings > Authorized domains.');
                } else if (error.code !== 'auth/popup-closed-by-user') {
                    alert(`Não foi possível autenticar: ${error.message}`);
                }
                alternarCarregamento(false);
            }
        }
    </script>
</body>
</html>
