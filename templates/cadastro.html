<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Lello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; border-top: 5px solid #198754; }
    </style>
</head>
<body>
    <div class="login-card">
        <h4 class="fw-bold text-center mb-4 text-success">Criar nova conta</h4>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label class="form-label small fw-bold text-muted">Nome Completo</label>
            <input type="text" name="nome" class="form-control mb-3" required>
            
            <label class="form-label small fw-bold text-muted">Filial/Equipe</label>
            <input type="text" name="filial" class="form-control mb-3" placeholder="Ex: (10) Centro Adm." required>

            <label class="form-label small fw-bold text-muted">E-mail corporativo</label>
            <input type="email" name="email" class="form-control mb-3" required>

            <label class="form-label small fw-bold text-muted">Senha de acesso</label>
            <input type="password" name="senha" class="form-control mb-4" required>

            <button class="btn btn-success w-100 fw-bold py-2" type="submit">Cadastrar e Continuar</button>
        </form>
        
        <div class="mt-4 text-center text-muted small">
            Já tem conta? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Voltar para Login</a>
        </div>
    </div>
</body>
</html>
