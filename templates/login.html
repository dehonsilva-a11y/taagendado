<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Lello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #0d6efd; }
        .btn-google { background-color: #fff; border: 1px solid #dae0e6; color: #3c4043; font-weight: 600; transition: background-color 0.2s; }
        .btn-google:hover { background-color: #f8f9fa; }
        .google-icon { width: 20px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="bi bi-buildings-fill text-primary mb-3" style="font-size: 3rem;"></i>
        <h3 class="fw-bold mb-2">Acesso ao Sistema</h3>
        <p class="text-muted small mb-4">Faça login com seu e-mail corporativo.</p>

        <!-- Botão de Login do Google -->
        <button onclick="fazerLoginGoogle()" class="btn btn-google w-100 py-2 d-flex justify-content-center align-items-center">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon" alt="Google" width="20" style="margin-right: 10px;">
            Entrar com o Google
        </button>

        <div id="loading" class="mt-3 d-none text-primary small">
            <div class="spinner-border spinner-border-sm me-1" role="status"></div> Autenticando...
        </div>
    </div>

    <!-- Bibliotecas do Firebase (Compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

    <script>
        // COLOQUE AS SUAS CREDENCIAIS WEB AQUI (Pegou no Passo 2)
        const firebaseConfig = {
            apiKey: "AIzaSyA4WPItplXhSjkEP9P9tx_XMNijrbd89XY",
            authDomain: "taagendado-9c7ab.firebaseapp.com",
            projectId: "taagendado-9c7ab",
            storageBucket: "taagendado-9c7ab.firebasestorage.app",
            messagingSenderId: "379315225586",
            appId: "1:379315225586:web:03ef20ab29f06f394fa16b"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const provider = new firebase.auth.GoogleAuthProvider();

        function fazerLoginGoogle() {
            document.getElementById('loading').classList.remove('d-none');
            
            firebase.auth().signInWithPopup(provider).then((result) => {
                return result.user.getIdToken();
            }).then((token) => {
                fetch('/auth_google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: token })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        window.location.href = "/"; 
                    } else {
                        // Se o Python barrar (não foi convidado), mostra o motivo
                        alert(data.message);
                        document.getElementById('loading').classList.add('d-none');
                        firebase.auth().signOut(); // Desloga do Firebase
                    }
                });
            }).catch((error) => {
                console.error("Erro no login:", error);
                document.getElementById('loading').classList.add('d-none');
            });
        }
    </script>
</body>
</html>
