<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Bloqueado - Lello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { 
            background: #f0f2f5; 
            font-family: 'Nunito', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border-top: 5px solid #dc3545; 
        }
        .gif-container img {
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- O novo GIF escolhido -->
        <div class="gif-container">
            <img src="https://wordpress-cms-revista-prod-assets.quero.space/legacy_posts/post_images/20236/7a036fbf925d907f392cfb6ebab0c09946877c1a.gif?1561052181" alt="Espera aí!">
        </div>

        <h3 class="fw-bold mb-2 text-danger"><i class="bi bi-shield-lock-fill me-2"></i>Acesso Bloqueado</h3>
        <p class="text-muted mb-4">Ops! Seu acesso está desativado no momento.</p>

        <p class="small text-secondary mb-4">
            Se você acredita que isso aconteceu por engano, fale com o gerente da sua filial para te ajudar a resolver.
        </p>

        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary w-100 py-2 fw-bold">
            <i class="bi bi-arrow-left me-2"></i> Voltar ao início
        </a>
    </div>
</body>
</html>
